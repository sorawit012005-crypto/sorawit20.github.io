<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สำรวจระบบสุริยะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#02030a;
  --ink:#ece8df;
  --dim:#a4a39b;
  --line:rgba(236,232,223,.16);
  --panel:rgba(7,9,18,.78);
  --gold:#ffb347;
  --gold-soft:rgba(255,179,71,.15);
  --display:'Prompt',system-ui,sans-serif;
  --body:'Sarabun',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #ffd08a;outline-offset:2px}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;cursor:grab}
#stage:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.label{position:absolute;left:0;top:0;font:500 13px/1 var(--body);color:var(--ink);text-shadow:0 1px 4px #000,0 0 8px #000;white-space:nowrap;will-change:transform;opacity:.9}
.label.on{color:var(--gold);opacity:1}

/* top rail */
#rail{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 22px;background:linear-gradient(to bottom,rgba(2,3,10,.9),rgba(2,3,10,0));pointer-events:none}
#row1{display:flex;align-items:center;gap:6px;min-width:0;pointer-events:none}
#row1>*{pointer-events:auto}
#menubar{pointer-events:auto;align-self:flex-start;max-width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
#menubar::-webkit-scrollbar{display:none}
.brand{margin:0;font:600 18px/1 var(--display);flex:none}
.brand button{background:none;border:0;padding:8px 10px 8px 4px;font:inherit;letter-spacing:.01em}
#chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(to right,#000 92%,transparent)}
#chips::-webkit-scrollbar{display:none}
.sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:rgba(10,13,26,.55);border:1px solid var(--line);font-size:14px;line-height:1.3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip:hover{background:rgba(24,28,48,.7)}
.chip[aria-current="true"]{border-color:var(--gold);background:var(--gold-soft)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.chip.hl{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-soft)}
.label.dim{opacity:.3}
.menu-item{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:5px 11px 6px;font-size:14px;line-height:1.4;color:var(--dim);text-shadow:0 1px 4px #000;transition:color .2s,border-color .2s}
.menu-item:hover{color:var(--ink)}
.menu-item[aria-current="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.grp-block{margin:0 0 16px}
.grp-block .note{margin:8px 0}
.grp{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:500;font-size:15px;text-align:left}
.grp em{font-style:normal;color:var(--dim);font-size:13px;font-weight:400}
.grp:hover{background:rgba(255,255,255,.07)}
.grp[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
ol.seq{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:s}
ol.seq li{display:flex;align-items:center;gap:10px;counter-increment:s}
ol.seq li::before{content:counter(s);width:18px;text-align:right;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.cmp-list{border-bottom:1px solid var(--line)}
.cmp{display:block;width:100%;padding:8px 0 9px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.cmp .top{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.cmp .nm{display:flex;align-items:center;gap:8px}
.cmp .nm i{width:9px;height:9px;border-radius:50%;flex:none}
.cmp b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.cmp .trk{display:block;position:relative;height:6px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.cmp .trk i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--gold)}
.cmp:hover .trk i{background:#ffd08a}
details.sec{border-top:1px solid var(--line);padding:6px 0}
details.sec:last-of-type{border-bottom:1px solid var(--line)}
details.sec summary{cursor:pointer;padding:6px 0;font:600 16px/1.5 var(--display)}
details.sec summary::marker{color:var(--gold)}
details.sec p{margin:6px 0 10px;font-size:15px;line-height:1.7}

/* info panel */
#panel{position:fixed;z-index:4;top:calc(104px + env(safe-area-inset-top,0px));right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));overflow-y:auto;overscroll-behavior:contain;padding:22px 22px 26px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
#panel.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
#panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
#panel .close:hover{background:rgba(255,255,255,.08)}
#panel h2{margin:0 36px 2px 0;font:600 28px/1.25 var(--display)}
#panel .kind{margin:0 0 14px;color:var(--dim);font-size:14px;display:flex;align-items:center;gap:8px}
#panel .kind i{width:9px;height:9px;border-radius:50%;flex:none}
#panel .lead{margin:0 0 18px;font-size:16px;line-height:1.7}
#panel h3{margin:22px 0 8px;font:600 15px/1.4 var(--display);color:var(--gold)}
dl.stats{margin:0}
dl.stats .row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
dl.stats .row:last-child{border-bottom:1px solid var(--line)}
dl.stats dt{color:var(--dim);font-size:14px;flex:none}
dl.stats dd{margin:0;text-align:right;font-weight:500;font-size:15px}
#panel ul.facts{margin:0;padding-left:20px}
#panel ul.facts li{margin:0 0 8px;font-size:15px;line-height:1.65;padding-left:2px}
#panel ul.facts li::marker{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{font-size:14px;padding:5px 12px}
.note{margin:12px 0 0;color:var(--dim);font-size:13px;line-height:1.6}
.rank{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;width:100%;padding:7px 0;background:none;border:0;text-align:left;font-size:15px}
.rank .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.rank b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rank:hover .bar i{background:#ffd08a}

/* controls */
#controls{position:fixed;z-index:3;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px}
#controls button{padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;line-height:1.4}
#controls button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
#controls label{display:flex;align-items:center;gap:8px;color:var(--dim)}
#controls input[type=range]{width:110px;accent-color:var(--gold)}
#controls output{min-width:36px;color:var(--ink);font-variant-numeric:tabular-nums}
#hint{position:fixed;z-index:2;top:calc(108px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:6px 14px;border-radius:999px;background:rgba(10,13,26,.6);border:1px solid var(--line);color:var(--dim);font-size:13px;text-align:center;transition:opacity .8s;pointer-events:none}
#hint.gone{opacity:0}

/* loader */
#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .9s;text-align:center;padding:24px}
#loader.done{opacity:0;pointer-events:none}
#loader h1{margin:0 0 6px;font:600 clamp(34px,8vw,60px)/1.2 var(--display)}
#loader p{margin:0 0 22px;color:var(--dim)}
#loader .bar{width:min(260px,70vw);height:3px;margin:0 auto;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

@media (max-width:720px){
  .brand{font-size:16px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:50vh;border-radius:18px 18px 0 0;border-bottom:0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 24px))}
  #panel.open{transform:none}
  #panel h2{font-size:24px}
  body.panel-open #controls{display:none}
  #controls{left:10px;right:10px;justify-content:space-between}
  #controls input[type=range]{width:90px}
}
@media (prefers-reduced-motion:reduce){
  #panel,#panel.open,.chip,#hint,#loader{transition:none}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="แบบจำลองระบบสุริยะสามมิติ ลากเพื่อหมุนมุมมอง"></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="rail">
  <div id="row1">
    <h1 class="brand"><button id="brand" type="button">ระบบสุริยะ</button></h1>
    <nav id="chips" aria-label="เลือกดาว"></nav>
  </div>
  <nav id="menubar" aria-label="เมนูเนื้อหา">
    <button type="button" class="menu-item" data-menu="m-parts">องค์ประกอบ</button>
    <button type="button" class="menu-item" data-menu="m-groups">จัดกลุ่มดาวเคราะห์</button>
    <button type="button" class="menu-item" data-menu="m-compare">เปรียบเทียบดาว</button>
    <button type="button" class="menu-item" data-menu="m-others">วัตถุท้องฟ้าอื่นๆ</button>
    <button type="button" class="menu-item" data-menu="m-help">วิธีใช้</button>
  </nav>
</header>

<div id="hint">ลากเพื่อหมุนมุมมอง เลื่อนล้อเมาส์หรือบีบนิ้วเพื่อซูม แตะที่ดาวเพื่อดูข้อมูล</div>

<aside id="panel" aria-label="ข้อมูลดาว"></aside>

<div id="controls">
  <button id="play" type="button" aria-pressed="false">หยุด</button>
  <label>ความเร็ว <input id="speed" type="range" min="0" max="20" step="0.5" value="1"><output id="speedOut">1×</output></label>
  <button id="tOrbits" type="button" aria-pressed="true">เส้นวงโคจร</button>
  <button id="tLabels" type="button" aria-pressed="true">ชื่อดาว</button>
</div>

<div id="loader">
  <div>
    <h1>ระบบสุริยะ</h1>
    <p id="loadMsg">กำลังสร้างพื้นผิวดาวแต่ละดวง</p>
    <div class="bar"><i id="barFill"></i></div>
  </div>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;background:#02030a;z-index:20">หน้านี้ต้องเปิดใช้ JavaScript</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ==========================================================
   ข้อมูลของแต่ละดาว: แก้ไขข้อความและตัวเลขได้ที่ส่วนนี้
   - stats  = แถวข้อมูลในกล่อง (ชื่อหัวข้อ, ค่า)
   - facts  = เรื่องน่ารู้ (ข้อความสั้นๆ ทีละข้อ)
   - moonCount = จำนวนดวงจันทร์ที่รู้จักทั้งหมด (ใช้จัดอันดับในหน้าภาพรวม)
   ========================================================== */
const DATA = {
  sun:{ name:'ดวงอาทิตย์', kind:'ดาวฤกษ์ ศูนย์กลางของระบบสุริยะ', color:'#ffb347',
    lead:'ดวงอาทิตย์เป็นดาวฤกษ์เพียงดวงเดียวในระบบสุริยะและเป็นศูนย์กลางของระบบสุริยะ เป็นดาวฤกษ์ขนาดเล็กเมื่อเทียบกับดาวฤกษ์อื่นๆ บนท้องฟ้า',
    stats:[['ชนิดของดาว','ดาวฤกษ์สีเหลือง'],['อายุ','ประมาณ 5,000 ล้านปี'],['ระยะห่างจากโลก','149.60 ล้าน กม.'],['เส้นผ่านศูนย์กลาง','1,392,530 กม.'],['เทียบกับโลก','ใหญ่กว่าเกือบ 109 เท่า'],['หมุนรอบตัวเอง 1 รอบ','27 วัน'],['อุณหภูมิพื้นผิวเฉลี่ย','ประมาณ 6,000 °C']],
    facts:['เป็นดาวฤกษ์ที่อยู่ใกล้โลกที่สุด จึงปรากฏให้เราเห็นเป็นดวงกลมโตบนท้องฟ้าเพียงดวงเดียว','ดาวฤกษ์ดวงอื่นๆ ปรากฏเป็นจุดสว่าง เพราะอยู่ไกลจากโลกมาก']},
  mercury:{ name:'ดาวพุธ', kind:'ดาวเคราะห์หิน (ดาวเคราะห์วงใน)', color:'#b0a89c', moonCount:0,
    lead:'เป็นดาวเคราะห์ที่มีขนาดเล็กและอยู่ใกล้ดวงอาทิตย์มากที่สุด จึงมีอุณหภูมิพื้นผิวสูงมาก ประมาณ 430 องศาเซลเซียส',
    stats:[['เส้นผ่านศูนย์กลาง','4,879 กม.'],['ระยะห่างจากดวงอาทิตย์เฉลี่ย','57.91 ล้าน กม.'],['โคจรรอบดวงอาทิตย์ 1 รอบ','87.97 วัน'],['หมุนรอบตัวเอง 1 รอบ','58.65 วัน'],['อุณหภูมิพื้นผิวเฉลี่ย','−180 ถึง 430 °C']],
    facts:['โคจรรอบดวงอาทิตย์ใช้เวลาเกือบเท่ากับเวลาที่ใช้หมุนรอบตัวเอง ด้านที่หันเข้าหาดวงอาทิตย์จึงร้อนมาก อีกด้านหนึ่งเย็นจัด ดาวพุธจึงได้ชื่อว่า “เตาไฟแช่แข็ง”','พื้นผิวเป็นฝุ่นและหินเช่นเดียวกับดวงจันทร์ มีหลุมลึกเป็นจำนวนมาก หลุมที่ใหญ่ที่สุดชื่อฟอสซา แคลอริส (Fossa Caloris)','มองเห็นได้ด้วยตาเปล่าในตอนเช้าก่อนดวงอาทิตย์ขึ้นครึ่งชั่วโมง และหลังจากดวงอาทิตย์ตกครึ่งชั่วโมง']},
  venus:{ name:'ดาวศุกร์', kind:'ดาวเคราะห์หิน (ดาวเคราะห์วงใน)', color:'#e3c58b', moonCount:0,
    lead:'มีขนาดใกล้เคียงกับโลก จึงได้ชื่อว่าเป็น “ฝาแฝด” ของโลก และอยู่ห่างจากดวงอาทิตย์เป็นอันดับที่ 2',
    stats:[['เส้นผ่านศูนย์กลาง','12,104 กม.'],['ระยะห่างจากดวงอาทิตย์เฉลี่ย','108.21 ล้าน กม.'],['โคจรรอบดวงอาทิตย์ 1 รอบ','224.70 วัน'],['หมุนรอบตัวเอง 1 รอบ','243 วัน'],['อุณหภูมิพื้นผิวเฉลี่ย','ประมาณ 470 °C']],
    facts:['จากการสำรวจโดยยานอวกาศ พบว่ามีพื้นผิวแห้งแล้ง และมีบรรยากาศหนาแน่นเป็น 90 เท่าของโลก','แก๊สส่วนใหญ่ในบรรยากาศเป็นคาร์บอนไดออกไซด์และไอของกรดกำมะถัน ไม่มีแก๊สออกซิเจนและไอน้ำ','บรรยากาศหนาทึบดูดกลืนความร้อนของดวงอาทิตย์ไว้และทำหน้าที่เหมือนเรือนกระจก อุณหภูมิจึงสูงกว่าดาวพุธมาก','ปรากฏสว่างที่สุดในดาวเคราะห์ทั้ง 8 ดวง เห็นทางทิศตะวันออกในเวลาใกล้รุ่ง เรียกว่า ดาวประกายพรึก หรือดาวรุ่ง และเห็นทางขอบฟ้าด้านทิศตะวันตกตอนดวงอาทิตย์ลับขอบฟ้า เรียกว่า ดาวประจำเมือง']},
  earth:{ name:'โลก', kind:'ดาวเคราะห์หิน', color:'#4f8fe0', moonCount:1,

    const L=lat+(fbm(x*3,y*3,z*3,3)-0.5)*0.1;
    let b=clamp(0.5+0.28*Math.sin(L*13+Math.sin(L*4))+(fbm(x*4,y*14,z*4,4)-0.5)*0.5,0,1);
    let c=ramp([[0,[26,48,150]],[0.6,[46,86,204]],[1,[100,146,238]]],b);
    const st=smooth(0.64,0.72,fbm(x*4+3,y*14,z*4,4))*smooth(0.9,0.1,Math.abs(lat+0.6));
    return mixc(c,[230,238,255],st*0.7);
  };
  return withSpot(base,2.4,-0.35,0.2,[14,24,92],0.8);
};
const sunFn=()=>(x,y,z,lat)=>{
  const w=fbm(x*2+1,y*2,z*2,3),n1=fbm(x*3+w*1.5,y*3,z*3+w*1.5,5),n2=fbm(x*9+n1*2,y*9,z*9,4);
  const t=clamp((n1*0.65+n2*0.35-0.3)*2.4,0,1);
  const spot=smooth(0.64,0.72,fbm(x*4+50,y*4,z*4,3))*smooth(0.55,0.2,Math.abs(lat));
  const c=ramp([[0,[140,26,0]],[0.35,[232,92,8]],[0.7,[255,164,36]],[1,[255,236,160]]],t),k=1-0.55*spot;
  return [c[0]*k,c[1]*k,c[2]*k];
};
const skyFn=()=>{
  const nx=0.35,ny=0.88,nz=0.32,nl=Math.hypot(nx,ny,nz);
  return (x,y,z)=>{
    const c=(x*nx+y*ny+z*nz)/nl,band=Math.exp(-(c*c)/(2*0.12*0.12));
    const n=fbm(x*3+11,y*3,z*3,5),dust=smooth(0.52,0.66,fbm(x*6+3,y*6,z*6,4));
    let v=band*(0.25+1.1*clamp((n-0.3)*2.2,0,1))*(1-0.65*dust)+Math.exp(-(c*c)/(2*0.5*0.5))*0.06;
    return [3+v*70,4+v*64,9+v*90];
  };
};
const ioFn=()=>(x,y,z)=>{
  const n=fbm(x*3+60,y*3,z*3,5);
  let c=ramp([[0,[168,92,40]],[0.45,[224,190,76]],[0.8,[240,226,130]],[1,[250,244,200]]],clamp((n-0.3)*2.6,0,1));
  c=mixc(c,[48,34,26],smooth(0.62,0.68,fbm(x*9+8,y*9,z*9,3))*0.85);
  return mixc(c,[196,62,40],smooth(0.7,0.76,fbm(x*14+3,y*14,z*14,2))*0.5);
};
const europaFn=()=>(x,y,z)=>{
  const n=fbm(x*3,y*3,z*3,4);
  const c=mixc([196,176,148],[240,236,228],clamp((n-0.3)*2.5,0,1));
  const l1=1-smooth(0,0.03,Math.abs(fbm(x*5+4,y*5,z*5,3)-0.5)),l2=1-smooth(0,0.018,Math.abs(fbm(x*11+9,y*11,z*11,3)-0.5));
  return mixc(c,[142,92,60],Math.max(l1*0.8,l2*0.5));
};
const titanFn=()=>(x,y,z)=>ramp([[0,[168,104,44]],[1,[232,172,92]]],clamp((fbm(x*2,y*5,z*2,4)-0.3)*2.5,0,1));
const enceladusFn=()=>(x,y,z,lat)=>{
  const g=0.92+0.08*fbm(x*4,y*4,z*4,3);
  let c=[243*g,247*g,252*g];
  const l=1-smooth(0,0.014,Math.abs(fbm(x*9+2,y*9,z*9,3)-0.5));
  return mixc(c,[150,200,235],l*(0.35+0.5*smooth(-0.9,-1.4,lat)));
};
const mirandaFn=()=>(x,y,z)=>{
  const v=smooth(0.49,0.51,fbm(x*4+41,y*4,z*4,4));
  const g=clamp(0.45+0.3*v+(fbm(x*10,y*10,z*10,3)-0.5)*0.2+craters(x,y,z,7,4)*0.12,0,1.1);
  return [190*g,188*g,184*g];
};
const tritonFn=()=>(x,y,z,lat)=>{
  let c=mixc([200,170,170],[242,228,226],clamp((fbm(x*3,y*3,z*3,4)-0.3)*2.5,0,1));
  c=mixc(c,[250,225,215],smooth(-0.3,-1.0,lat)*0.7);
  c=mixc(c,[70,55,60],smooth(0.62,0.7,fbm(x*8+5,y*8,z*8,3))*0.5);
  const cr=1+craters(x,y,z,6,6)*0.1;return [c[0]*cr,c[1]*cr,c[2]*cr];
};

function ringTex(kind){
  const w=1024,c=document.createElement('canvas');c.width=w;c.height=2;
  const g=c.getContext('2d'),img=g.createImageData(w,2);
  for(let i=0;i<w;i++){
    const t=i/(w-1);let a,k;
    const n=vn(t*60,3.1,7.7)*0.5+vn(t*180,1.3,2.2)*0.3+vn(t*500,9,9)*0.2;
    if(kind==='saturn'){
      if(t<0.1)a=0;else if(t<0.16)a=0.18;else if(t<0.46)a=0.55+0.4*n;else if(t<0.52)a=0.06;else if(t<0.97)a=0.45+0.35*n;else a=0;
      if(t>0.86&&t<0.875)a*=0.15;
      k=0.8+0.35*n;
    }else{a=(t>0.1&&t<0.9)?0.4*(0.4+vn(t*80,1,1)):0;k=0.7;}
    const col=kind==='saturn'?[218*k,200*k,165*k]:[150,160,170];
    for(let r=0;r<2;r++){const o=(r*w+i)*4;img.data[o]=col[0];img.data[o+1]=col[1];img.data[o+2]=col[2];img.data[o+3]=clamp(a,0,1)*255;}
  }
  g.putImageData(img,0,0);
  return new THREE.CanvasTexture(c);
}

function glowTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,236,170,1)');gr.addColorStop(0.22,'rgba(255,176,64,.6)');
  gr.addColorStop(0.55,'rgba(255,112,22,.14)');gr.addColorStop(1,'rgba(255,90,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);
}
function atmo(color,r,k){
  const m=new THREE.ShaderMaterial({
    uniforms:{c:{value:new THREE.Color(color)},k:{value:k}},
    vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vN;uniform vec3 c;uniform float k;void main(){float i=pow(max(0.0,0.72-dot(vN,vec3(0.0,0.0,1.0))),3.0)*k;gl_FragColor=vec4(c*i,1.0);}',
    side:THREE.BackSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false
  });
  return new THREE.Mesh(new THREE.SphereGeometry(r,48,32),m);
}
function circle(R,inc,color,op){
  const pts=[],seg=256;
  for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R*Math.sin(inc),Math.sin(a)*R*Math.cos(inc)));}
  return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity:op,depthWrite:false}));
}
function ringGeo(inn,out){
  const g=new THREE.RingGeometry(inn,out,128,1),pos=g.attributes.position,uv=g.attributes.uv,v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);uv.setXY(i,(v.length()-inn)/(out-inn),0.5);}
  return g;
}
function addProxy(b){

}

const ctl={
  target:new THREE.Vector3(),offset:new THREE.Vector3(),focus:null,
  th:0.7,ph:1.0,r:1700,thG:0.7,phG:1.05,rG:600,minR:80,maxR:1800,shiftX:0,shiftY:0,shiftXG:0,shiftYG:0,
  setFocus(b){this.focus=b;this.offset.copy(this.target).sub(b?b.wp:ZERO);},
  update(dt){
    const base=this.focus?this.focus.wp:ZERO;
    this.offset.multiplyScalar(Math.exp(-dt*3));this.target.copy(base).add(this.offset);
    const k=1-Math.exp(-dt*4.5);
    this.th+=(this.thG-this.th)*k;this.ph+=(this.phG-this.ph)*k;
    this.r=Math.exp(Math.log(this.r)+(Math.log(this.rG)-Math.log(this.r))*k);
    const sp=Math.sin(this.ph);
    camera.position.set(this.target.x+this.r*sp*Math.cos(this.th),this.target.y+this.r*Math.cos(this.ph),this.target.z+this.r*sp*Math.sin(this.th));
    camera.lookAt(this.target);
    this.shiftX+=(this.shiftXG-this.shiftX)*k;this.shiftY+=(this.shiftYG-this.shiftY)*k;
    if(Math.abs(this.shiftX)>0.5||Math.abs(this.shiftY)>0.5)camera.setViewOffset(W,H,this.shiftX,this.shiftY,W,H);
    else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
  }
};

  h+=sec('ดาวเคราะห์น้อย','<p>เป็นวัตถุขนาดเล็กๆ จำนวนมากที่อยู่ในระบบสุริยะ มีขนาดเท่าเม็ดฝุ่นจนถึงขนาดใหญ่ที่มีเส้นผ่านศูนย์กลางเกือบพันกิโลเมตร ประกอบด้วยหินและโลหะ ซึ่งเกาะกันเป็นวงแหวนอยู่ระหว่างดาวอังคารและดาวพฤหัสบดี และอยู่ห่างจากโลกประมาณ 150 ถึง 354 ล้านกิโลเมตร</p><p>ดาวเคราะห์น้อยจัดเป็นบริวารของดวงอาทิตย์และโคจรรอบดวงอาทิตย์ เช่นเดียวกับดาวดวงอื่นๆ</p><div class="chips">'+chipBtn('belt')+'</div>');
  h+=sec('ดาวหาง','<p>เป็นวัตถุท้องฟ้าที่ไม่มีแสงในตัวเอง และโคจรรอบดวงอาทิตย์เป็นรูปวงรี ประกอบด้วยน้ำและแก๊สที่เย็นจัดรวมตัวเป็นก้อนแข็งและของแข็ง นักดาราศาสตร์จัดรวมดาวหางไว้เป็นส่วนหนึ่งของระบบสุริยะ เพราะโคจรรอบดวงอาทิตย์ จึงจัดเป็นบริวารของดวงอาทิตย์</p><p>เมื่ออยู่ไกลจากดวงอาทิตย์ จะดูคล้ายก้อนน้ำแข็งสกปรก มีหินและฝุ่นเกาะกันเป็นส่วนประกอบ เมื่อเริ่มเคลื่อนเข้าใกล้ดวงอาทิตย์ น้ำแข็งรอบนอกจะระเหิดกลายเป็นแก๊สและฝุ่น ทำให้เห็นเป็นหางของดาวหาง ซึ่งชี้ไปในทิศทางตรงกันข้ามกับดวงอาทิตย์</p>');
  return h;
}
function helpHTML(){
  let h=menuHead('วิธีใช้','การเรียนรู้ผ่านแบบจำลองสามมิติ');
  h+='<h3>ควบคุมมุมมอง</h3><ul class="facts"><li>ลากด้วยเมาส์หรือนิ้ว เพื่อหมุนมุมมอง</li><li>เลื่อนล้อเมาส์ หรือใช้สองนิ้วบีบ เพื่อซูมเข้าออก</li><li>แตะที่ดาวในภาพ หรือเลือกชื่อดาวจากแถบด้านบน เพื่อซูมเข้าไปอ่านข้อมูล</li><li>กดปุ่ม Esc หรือปุ่มกากบาท เพื่อปิดแผงข้อมูลและกลับมาดูภาพรวม</li></ul>';
  h+='<h3>แถบเมนู</h3><ul class="facts"><li>องค์ประกอบ: สมาชิกทั้งหมดของระบบสุริยะ</li><li>จัดกลุ่มดาวเคราะห์: วงใน วงนอก ดาวเคราะห์หิน ดาวเคราะห์แก๊ส และดาวที่มีวงแหวน</li><li>เปรียบเทียบดาว: เทียบขนาด ระยะทาง เวลาโคจร เวลาหมุน อุณหภูมิ และจำนวนดวงจันทร์</li><li>วัตถุท้องฟ้าอื่นๆ: ดาวเคราะห์แคระ ดาวเคราะห์น้อย และดาวหาง</li></ul>';
  h+='<h3>ปุ่มด้านล่างซ้าย</h3><ul class="facts"><li>หยุด หรือเล่น การเคลื่อนที่ของดาว</li><li>เลื่อนแถบความเร็ว เพื่อให้ดาวโคจรช้าลงหรือเร็วขึ้น</li><li>เปิดหรือปิดเส้นวงโคจร และชื่อดาว</li></ul>';
  h+='<h3>แหล่งข้อมูล</h3><p class="note">ข้อมูลในแผงของดวงอาทิตย์ ดาวเคราะห์ ซีรีส และแถบดาวเคราะห์น้อย อ้างอิงจากหนังสือเรียนหน่วยการเรียนรู้ที่ 4 ระบบสุริยะและการปรากฏของดวงจันทร์ ส่วนแผงของดวงจันทร์บริวารเป็นข้อมูลเสริมที่ไม่ได้อยู่ในหนังสือ</p><p class="note">พื้นผิวดาวในภาพสร้างจำลองด้วยโค้ด ไม่ใช่ภาพถ่ายจริง และขนาดกับระยะทางถูกย่อส่วน</p>';
  return h;
}
function menuHTML(id){
  return id==='m-parts'?partsHTML():id==='m-groups'?groupsHTML():id==='m-compare'?compareHTML():id==='m-others'?othersHTML():helpHTML();
}
function renderMenu(){
  if(!panelId||panelId.indexOf('m-')!==0)return;
  const a=document.activeElement;let sel=null;
  if(a&&panel.contains(a)){
    if(a.dataset.grp)sel='[data-grp="'+a.dataset.grp+'"]';
    else if(a.dataset.metric)sel='[data-metric="'+a.dataset.metric+'"]';
    else if(a.hasAttribute('data-sort'))sel='[data-sort]';
  }
  const st=panel.scrollTop;panel.innerHTML=menuHTML(panelId);panel.scrollTop=st;
  if(sel){const n=panel.querySelector(sel);if(n)n.focus({preventScroll:true});}
}
function setHL(ids){
  hlSet=new Set(ids||[]);
  orbitLines.forEach(l=>{
    const pid=l.userData.pid;if(!pid)return;
    const on=hlSet.has(pid);
    l.material.color.set(on?0xffb347:0x8f9bbd);l.material.opacity=on?0.85:(hlSet.size?0.1:0.22);
  });
  chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hl',hlSet.has(c.dataset.go)));
}
function markMenu(id){
  menubarEl.querySelectorAll('.menu-item').forEach(b=>{if(b.dataset.menu===id)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
}
function showMenu(id){
  if(panelId===id){overview(false);return;}
  selected=null;ctl.setFocus(null);ctl.minR=80;ctl.maxR=1800;ctl.rG=overviewR();ctl.phG=1.05;
  markRail(null);setHL(null);grpSel=null;
  openPanel(id);markMenu(id);
  hintEl.classList.add('gone');
}
function openPanel(id){
  panelId=id;panel.innerHTML=id==='overview'?overviewHTML():(id.indexOf('m-')===0?menuHTML(id):panelHTML(id));panel.scrollTop=0;
  panel.classList.add('open');document.body.classList.add('panel-open');
  setShift(true);
}
function closePanel(){panel.classList.remove('open');document.body.classList.remove('panel-open');panelId=null;setShift(false);}
function setShift(open){
  if(!open){ctl.shiftXG=0;ctl.shiftYG=0;return;}
  if(MOBILE.matches){ctl.shiftXG=0;ctl.shiftYG=H*0.2;}else{ctl.shiftXG=(380+32)/2;ctl.shiftYG=0;}
}
function markRail(id){
  chipsEl.querySelectorAll('.chip').forEach(c=>{
    if(c.dataset.go===id){c.setAttribute('aria-current','true');c.scrollIntoView({inline:'center',block:'nearest',behavior:REDUCED?'auto':'smooth'});}
    else c.removeAttribute('aria-current');
  });
}
function select(id){
  const b=bodies[id];if(!b)return;
  setHL(null);markMenu(null);grpSel=null;
  selected=b;ctl.setFocus(b);
  ctl.minR=b.minR;ctl.maxR=b.maxR;ctl.rG=b.focusR;
  ctl.phG=b.kind==='belt'?0.95:1.2;
  openPanel(id);markRail(id in {belt:1,sun:1,mercury:1,venus:1,earth:1,mars:1,jupiter:1,saturn:1,uranus:1,neptune:1}?id:(b.kind==='moon'?b.parentId:'belt'));
  hintEl.classList.add('gone');
}
function overview(showPanel){
  selected=null;ctl.setFocus(null);ctl.minR=80;ctl.maxR=1800;ctl.rG=overviewR();ctl.phG=1.05;
  markRail(null);setHL(null);markMenu(null);grpSel=null;
  if(showPanel)openPanel('overview');else closePanel();
}
document.getElementById('brand').addEventListener('click',()=>overview(true));
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){select(go.dataset.go);return;}
  const mn=e.target.closest('[data-menu]');
  if(mn){showMenu(mn.dataset.menu);return;}
  const gp=e.target.closest('[data-grp]');
  if(gp){grpSel=grpSel===gp.dataset.grp?null:gp.dataset.grp;setHL(grpSel?GROUPS.find(g=>g.id===grpSel).ids:null);renderMenu();return;}
  const mt=e.target.closest('[data-metric]');
  if(mt){metric=mt.dataset.metric;renderMenu();return;}
  if(e.target.closest('[data-sort]')){sortDesc=!sortDesc;renderMenu();return;}
  if(e.target.closest('#panel .close'))overview(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overview(false);});

/* ปุ่มควบคุม */
const playBtn=document.getElementById('play'),speedEl=document.getElementById('speed'),speedOut=document.getElementById('speedOut');
playBtn.addEventListener('click',()=>{paused=!paused;playBtn.setAttribute('aria-pressed',String(paused));playBtn.textContent=paused?'เล่น':'หยุด';});
speedEl.addEventListener('input',()=>{speed=parseFloat(speedEl.value);speedOut.textContent=speed+'×';});
document.getElementById('tOrbits').addEventListener('click',e=>{showOrbits=!showOrbits;e.currentTarget.setAttribute('aria-pressed',String(showOrbits));});
document.getElementById('tLabels').addEventListener('click',e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',String(showLabels));labelsEl.style.display=showLabels?'':'none';});

/* ============ การควบคุมด้วยเมาส์/นิ้ว และการคลิกเลือกดาว ============ */
const ptrs=new Map(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let travel=0,pinch0=0;
const dist2=()=>{const v=Array.from(ptrs.values());return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);};
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)travel=0;
  if(ptrs.size===2)pinch0=dist2();
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;travel+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){ctl.thG-=dx*0.006;ctl.phG=clamp(ctl.phG-dy*0.006,0.1,Math.PI-0.1);}
  else if(ptrs.size===2){const d=dist2();if(pinch0>0)zoom(pinch0/d);pinch0=d;}
});
const endPtr=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(had&&ptrs.size===0&&travel<8&&e.type==='pointerup')pick(e.clientX,e.clientY);
  pinch0=0;
};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*0.0012));},{passive:false});
function pick(cx,cy){
  ndc.set(cx/W*2-1,-(cy/H*2-1));ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables.filter(p=>p.userData.active()),false);
  const h=hits.find(x=>x.object.userData.id!=='belt')||hits[0];
  if(h)select(h.object.userData.id);
}

/* ============ ชื่อลอยบนดาว ============ */
const labelItems=[];
function makeLabels(){
  Object.keys(bodies).forEach(id=>{
    if(id==='belt')return;
    const el=document.createElement('div');el.className='label';el.textContent=DATA[id].name;labelsEl.appendChild(el);
    labelItems.push({id,el,b:bodies[id]});
  });
  const el=document.createElement('div');el.className='label';el.textContent=DATA.belt.name;labelsEl.appendChild(el);
  labelItems.push({id:'belt',el,b:bodies.belt,fixed:new THREE.Vector3(Math.cos(0.5)*110,0,Math.sin(0.5)*110)});
}
const tmp=new THREE.Vector3();

/* ============ ลูปแอนิเมชัน ============ */
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05),sd=paused?0:dt*speed;
  const ids=Object.keys(bodies);
  for(const id of ids){
    const b=bodies[id];
    if(b.kind==='planet'){
      b.a+=b.w*sd;b.group.position.set(Math.cos(b.a)*b.def.R,0,Math.sin(b.a)*b.def.R);
      b.mesh.rotation.y+=b.spin*sd;if(b.clouds)b.clouds.rotation.y+=b.spin*sd*1.12;
    }else if(b.kind==='moon'){
      b.a+=b.w*sd;const d=b.def.d;
      b.group.position.set(Math.cos(b.a)*d,Math.sin(b.a)*d*Math.sin(b.inc),Math.sin(b.a)*d*Math.cos(b.inc));
      b.mesh.rotation.y+=0.4*sd;
    }else if(b.kind==='ceres'){
      b.a+=b.w*sd;b.group.position.set(Math.cos(b.a)*b.R,0,Math.sin(b.a)*b.R);b.mesh.rotation.y+=0.8*sd;
    }else if(b.kind==='belt'){b.group.rotation.y+=b.w*sd;}
    else if(b.kind==='sun'){b.mesh.rotation.y+=0.03*(paused?0:dt);}
  }
  scene.updateMatrixWorld(true);
  for(const id of ids)bodies[id].group.getWorldPosition(bodies[id].wp);
  const sysId=selected?(selected.kind==='moon'?selected.parentId:(selected.kind==='planet'?selected.id:null)):null;
  for(const id of ids){
    const b=bodies[id];
    if(b.kind==='moon'){
      const pl=bodies[b.parentId];
      b.group.visible=sysId===b.parentId||camera.position.distanceTo(pl.wp)<pl.moonShow;
    }
    if(b.proxy&&b.group.visible){const dd=camera.position.distanceTo(b.wp);b.proxy.scale.setScalar(Math.max(1,dd*0.02/b.r));}
  }
  ctl.update(dt);
  orbitLines.forEach(l=>{l.visible=showOrbits;});
  moonLines.forEach(l=>{l.visible=showOrbits&&sysId===l.userData.of;});
  renderer.render(scene,camera);
  camera.updateMatrixWorld();
  if(showLabels){
    for(const it of labelItems){
      const b=it.b;let vis=true;
      if(b.kind==='moon')vis=b.group.visible;
      if(b.kind==='ceres')vis=selected&&(selected.id==='belt'||selected.id==='ceres');
      if(it.id==='belt')vis=!selected||selected.id==='belt'||selected.id==='ceres';
      if(!vis){it.el.style.display='none';continue;}
      tmp.copy(it.fixed||b.wp).project(camera);
      if(tmp.z>1||tmp.z<-1){it.el.style.display='none';continue;}
      const x=(tmp.x*0.5+0.5)*W,y=(-tmp.y*0.5+0.5)*H,off=it.id==='sun'?22:10;
      it.el.style.display='';it.el.style.transform='translate('+(x+off).toFixed(1)+'px,'+(y-8).toFixed(1)+'px)';
      it.el.classList.toggle('on',(!!selected&&selected.id===it.id)||hlSet.has(it.id));
      it.el.classList.toggle('dim',hlSet.size>0&&!hlSet.has(it.id));
    }
  }
}

/* ============ เริ่มต้น ============ */
build().then(()=>{
  makeLabels();
  ctl.minR=80;ctl.maxR=1800;ctl.rG=overviewR();
  if(!REDUCED){ctl.r=Math.min(ctl.rG*3.2,3000);ctl.th=-1.2;ctl.ph=0.45;}else{ctl.r=ctl.rG;ctl.th=ctl.thG;ctl.ph=ctl.phG;}
  scene.updateMatrixWorld(true);
  clock.start();frame();
  loaderEl.classList.add('done');
  setTimeout(()=>{loaderEl.style.display='none';},1000);
  setTimeout(()=>{if(!MOBILE.matches)overview(true);},REDUCED?0:1800);
  setTimeout(()=>hintEl.classList.add('gone'),9000);
  window.addEventListener('resize',()=>{if(panelId)setShift(true);});
}).catch(err=>{
  console.error(err);
  document.getElementById('loadMsg').textContent='สร้างฉากไม่สำเร็จ ลองโหลดหน้าใหม่อีกครั้ง';
});

})();
</script>
